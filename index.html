/* 版面：單欄手機優先。首頁是店家清單 → 點進店家看分類菜單；底部固定訂單列，點開從下方滑出；#admin 是主揪後台。每家店有自己的主色，其他配色共用。 */
:root{
  --bg:#f4f5ef; --surface:#ffffff; --ink:#2b3526; --muted:#667061; --line:#d8dccd; --tint:#e6eadb;
  --on-accent:#f7f8f2; --red:#8e2b2b; --on-red:#ffffff;
  --a-home:#3d4b33; --a-daming:#3d4b33; --a-qingshan:#2f6250; --a-dezheng:#24427a; --a-hachiyo:#5b4a6e;
  --accent:var(--a-home);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"Barlow Condensed","Noto Sans TC","PingFang TC",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161a13; --surface:#1f251b; --ink:#e7ebdc; --muted:#9ba68f; --line:#333c2d; --tint:#272f21;
    --on-accent:#141a10; --red:#e59383; --on-red:#2a0f0b;
    --a-home:#b9d19a; --a-daming:#b9d19a; --a-qingshan:#93d1b5; --a-dezheng:#a9c1f0; --a-hachiyo:#cdb8e6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161a13; --surface:#1f251b; --ink:#e7ebdc; --muted:#9ba68f; --line:#333c2d; --tint:#272f21;
  --on-accent:#141a10; --red:#e59383; --on-red:#2a0f0b;
  --a-home:#b9d19a; --a-daming:#b9d19a; --a-qingshan:#93d1b5; --a-dezheng:#a9c1f0; --a-hachiyo:#cdb8e6;
  color-scheme:dark;
}
:root[data-store="daming"]{--accent:var(--a-daming)}
:root[data-store="qingshan"]{--accent:var(--a-qingshan)}
:root[data-store="dezheng"]{--accent:var(--a-dezheng)}
:root[data-store="hachiyo"]{--accent:var(--a-hachiyo)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font:400 15px/1.5 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:8px; padding-bottom:128px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
a{color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}

.brand{padding:20px 0 6px}
.eyebrow{font:600 12px var(--num);letter-spacing:.16em;color:var(--muted)}
h1{font:900 32px/1.15 var(--serif);letter-spacing:.06em;margin:8px 0 4px;text-wrap:balance}
.sub{font-size:13px;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-size:14px;padding:6px 0;cursor:pointer}
.tools{display:grid;gap:10px;margin:16px 0 4px}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.field:focus-within{border-color:var(--accent)}
.field label{font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:12px 0;outline:0}
.hint{font-size:12.5px;color:var(--muted);margin:0}

.stores{display:grid;gap:10px;margin-top:20px}
.store{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;text-decoration:none}
.store:hover{border-color:var(--sa)}
.store b{display:block;font:900 22px/1.25 var(--serif);letter-spacing:.06em;color:var(--sa)}
.store span.s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.store .go{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.store .cnt{font:600 13px/1 var(--sans);background:var(--sa);color:var(--on-accent);border-radius:999px;padding:5px 9px}
.store .arr{font-size:22px;color:var(--sa)}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);margin-top:12px}
.navin{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.navin button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.navin button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

section.cat{scroll-margin-top:calc(58px + env(safe-area-inset-top,0px));padding-top:26px}
.cat-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--accent);padding-bottom:6px}
.cat-h h2{font:900 23px/1.2 var(--serif);letter-spacing:.06em;margin:0;color:var(--accent)}
.sz{font:600 15px var(--num);letter-spacing:.06em;color:var(--muted)}
.desc{font-size:13px;color:var(--muted);margin:6px 0 2px}
ul{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 0;cursor:pointer}
.item:active{background:var(--tint)}
.zh{font-weight:700;font-size:16px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.en{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.note{display:block;font-size:12.5px;color:var(--red);font-weight:500}
.price{font:600 22px var(--num);font-variant-numeric:tabular-nums;text-align:right}
.prices{display:grid;grid-template-columns:auto auto;column-gap:6px;align-items:baseline;font-variant-numeric:tabular-nums}
.prices i{font:500 12px var(--sans);color:var(--muted);font-style:normal;text-align:right}
.prices b{font:600 19px/1.15 var(--num);text-align:right}
.plus{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:22px;line-height:1}
.tg{font:600 11px/1 var(--sans);padding:3px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tg.pop{color:var(--accent);border-color:var(--accent)}
.tg.red{background:var(--red);color:var(--on-red);border-color:var(--red)}
.empty{color:var(--muted);padding:28px 0;text-align:center}
.legend{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:grid;gap:4px}

.ov{position:fixed;inset:0;background:rgba(10,14,8,.5);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:18px 18px 0 0;z-index:31;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sh-head,.sh-body,.sh-foot{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:16px;padding-bottom:8px}
.sh-t{font:900 22px/1.25 var(--serif);letter-spacing:.04em}
.x{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:var(--tint);font-size:22px;line-height:1;cursor:pointer}
.sh-body{overflow-y:auto;padding-bottom:12px}
.sh-foot{display:flex;gap:12px;align-items:center;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.grp{margin-top:16px}
.grp h3{font:700 13px var(--sans);letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:500;padding:8px 13px;border-radius:999px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.fine{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;flex:none}
.step button{width:38px;height:38px;border:0;background:none;font-size:20px;cursor:pointer}
.step span{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.primary{flex:1;min-width:0;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;padding:13px 16px;border-radius:12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.primary .n{font:600 20px/1.2 var(--num);font-variant-numeric:tabular-nums}
.sec{flex:none;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:14px;padding:12px 14px;border-radius:12px;cursor:pointer}
.sec:disabled,.primary:disabled{opacity:.6;cursor:default}
.ghost{flex:none;border:0;background:none;color:var(--muted);font-size:14px;padding:10px 4px;cursor:pointer;text-decoration:underline}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 65%,transparent)}
.bar .primary{display:flex;max-width:640px;margin:0 auto;width:100%;box-shadow:0 4px 16px rgba(0,0,0,.22)}

.shop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:22px;padding:8px 12px;border-radius:8px;background:var(--tint)}
.shop b{font:900 18px var(--serif);letter-spacing:.06em}
.shop span{font:600 18px var(--num);font-variant-numeric:tabular-nums}
.person{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);margin-top:14px;padding-bottom:4px}
.person b{font:700 15px var(--sans)}
.person span{font:600 17px var(--num);font-variant-numeric:tabular-nums}
.ln{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ln .d{min-width:0;font-weight:500}
.ln small{display:block;font:500 13px var(--num);color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
textarea{display:block;width:100%;margin-top:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:14px/1.7 var(--sans);resize:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:40;max-width:calc(100% - 32px);text-align:center}

.adm-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:22px 0 6px;border-bottom:2px solid var(--ink);margin-bottom:14px}
.adm-h h2{font:900 24px/1.2 var(--serif);letter-spacing:.08em;margin:0}
.adm-h a{color:var(--muted);font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:28px;padding:14px 0 6px}
.stats b{display:block;font:600 34px/1 var(--num);font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips span{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.chips b{font:600 15px var(--num);margin-left:4px}
.adm-act{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
.bt{display:flex;justify-content:flex-end;margin-top:6px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>

function cartRows(){return cart.map(function(l){return{store:BY[l.store].name,person:l.person,desc:l.d,qty:l.qty,unit:l.unit}})}
function sumRows(rows){var n=0,t=0;rows.forEach(function(r){n+=r.qty;t+=r.unit*r.qty});return{n:n,t:t}}
function groupBy(rows,key){
  var idx=Object.create(null),gs=[];
  rows.forEach(function(r){var k=r[key];if(!(k in idx)){idx[k]=gs.length;gs.push({name:k,rows:[]})}gs[idx[k]].rows.push(r)});
  return gs;
}
function storeOrder(gs){
  var order=STORES.map(function(s){return s.name});
  return gs.sort(function(a,b){var x=order.indexOf(a.name),y=order.indexOf(b.name);return (x<0?99:x)-(y<0?99:y)});
}
function storeText(g,fmt){
  var o=['〔'+g.name+'〕'],tt=sumRows(g.rows);
  if(fmt==='person'){
    groupBy(g.rows,'person').forEach(function(p){
      o.push('■ '+p.name+'　$'+sumRows(p.rows).t);
      p.rows.forEach(function(r){o.push('・'+r.desc+' ×'+r.qty+'　$'+r.unit*r.qty)});
    });
  }else{
    var m=Object.create(null),ord=[];
    g.rows.forEach(function(r){
      if(!m[r.desc]){m[r.desc]={q:0,who:Object.create(null),ord:[]};ord.push(r.desc)}
      var e=m[r.desc];e.q+=r.qty;
      if(!(r.person in e.who)){e.who[r.person]=0;e.ord.push(r.person)}
      e.who[r.person]+=r.qty;
    });
    ord.forEach(function(k,i){var e=m[k];o.push((i+1)+'. '+k+' ×'+e.q+'（'+e.ord.map(function(p){return e.who[p]>1?p+'×'+e.who[p]:p}).join('、')+'）')});
  }
  o.push('小計 '+tt.n+' 項 $'+tt.t);
  return o.join('\n');
}
function orderText(rows,fmt){
  var gs=storeOrder(groupBy(rows,'store')),tt=sumRows(rows);
  var o=[HEAD];
  gs.forEach(function(g){o.push('');o.push(storeText(g,fmt))});
  if(gs.length>1){o.push('');o.push('全部合計 '+tt.n+' 項 $'+tt.t)}
  return o.join('\n');
}

  if(!el)return;
  var a=el.dataset.act,d=el.dataset;
  if(a==='open'){openItem(d.id);return}
  if(a==='cart'){S={mode:'cart',fmt:S.fmt||'person',confirmClear:false};show();return}
  if(a==='close'){hide();return}
  if(a==='akey'){var kv=$('#akey');if(kv)store.set('daming-key',kv.value.trim());aload();return}
  if(a==='arefresh'){aload();return}
  if(a==='afmt'){A.fmt=d.v;paintAdmin();return}
  if(a==='acopy'){if(d.i==='all')copyAll();else copyFrom('#atxt'+d.i);return}
  if(a==='adel'){apost({action:'delete',batch:d.b});return}
  if(a==='aclr'){
    if(A.confirm){A.confirm=false;apost({action:'clear'})}
    else{A.confirm=true;paintAdmin();setTimeout(function(){if(A.confirm){A.confirm=false;paintAdmin()}},3000)}
    return;
  }
  if(a==='submit'){submitOrder();return}
  if(a==='v')S.v=+d.i;
  else if(a==='sz')S.sz=+d.i;
  else if(a==='ice')S.ice=+d.i;
  else if(a==='sg')S.sugar=+d.i;
  else if(a==='tp'){var i=+d.i,j=S.tops.indexOf(i);if(j>-1)S.tops.splice(j,1);else S.tops.push(i)}
  else if(a==='qm')S.qty=Math.max(1,S.qty-1);
  else if(a==='qp')S.qty=Math.min(20,S.qty+1);
  else if(a==='add'){addToCart();return}
  else if(a==='fmt')S.fmt=d.v;
  else if(a==='inc'){var l=findLine(d.k);if(l){l.qty=Math.min(99,l.qty+1);save()}}
  else if(a==='dec'){var l2=findLine(d.k);if(l2){l2.qty--;if(l2.qty<=0)cart=cart.filter(function(x){return x!==l2});save()}}
  else if(a==='copy'){copyFrom('#txt');return}
  else if(a==='clear'){
    if(S.confirmClear){cart=[];save();hide();bar();toast('訂單已清空');return}
    S.confirmClear=true;paint();
    setTimeout(function(){if(S.mode==='cart'&&S.confirmClear){S.confirmClear=false;paint()}},3000);
    return;
  }
  else return;
  if(S.mode==='cart'&&!cart.length){bar();paint();return}
  if(S.mode)paint();
  bar();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.mode)hide();
  if(e.key==='Enter'&&e.target&&e.target.id==='akey'){store.set('daming-key',e.target.value.trim());aload()}
});

function route(){
  var h=location.hash.replace('#',''),adm=h==='admin',s=BY[h]||null;
  hide();
  $('#home').hidden=adm||!!s;$('#shop').hidden=!s;$('#admin').hidden=!adm;
  if(s){
    document.documentElement.setAttribute('data-store',s.id);
    if(cur!==s){cur=s;renderShop()}
  }else{
    document.documentElement.removeAttribute('data-store');
    cur=null;
  }
  if(adm){paintAdmin();if(ENDPOINT&&adminKey()&&!A.rows&&!A.loading)aload()}
  window.scrollTo(0,0);
  bar();
}
window.addEventListener('hashchange',route);
if(ENDPOINT)$('#hint').textContent='每個人先輸入自己的名字再點，按「送出訂單」後，主揪會在後台看到。';
renderHome();route();
})();
</script>
</body></html>
